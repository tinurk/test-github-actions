name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests

      - name: flake8
        run: flake8 src/

      - name: mypy
        run: mypy src/

      - name: black
        run: black --diff --check src/

      - name: isort
        run: isort --check-only --diff src/
